<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LifePlan Expense Management — Track your spending">
  <title>LifePlan — Expenses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Sidebar Navigation -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none"><rect x="4" y="4" width="40" height="40" rx="12" fill="url(#g)" opacity=".15"/><rect x="8" y="8" width="32" height="32" rx="8" fill="url(#g)" opacity=".3"/><path d="M16 24L22 30L32 18" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g" x1="4" y1="4" x2="44" y2="44"><stop stop-color="#6C5CE7"/><stop offset="1" stop-color="#00D2FF"/></linearGradient></defs></svg>
        <span class="sidebar-title">LifePlan</span>
      </div>
    </div>
    <ul class="sidebar-nav">
      <li><a href="/dashboard.html" class="nav-link" id="nav-dashboard"><span class="nav-icon">📊</span> Dashboard</a></li>
      <li><a href="/expenses.html" class="nav-link active" id="nav-expenses"><span class="nav-icon">💰</span> Expenses</a></li>
      <li><a href="/budget.html" class="nav-link" id="nav-budget"><span class="nav-icon">🎯</span> Budget</a></li>
      <li><a href="/savings.html" class="nav-link" id="nav-savings"><span class="nav-icon">🏦</span> Savings</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="user-info">
        <span class="user-avatar">👤</span>
        <span class="user-name" id="user-name">Loading...</span>
      </div>
      <button class="btn-link sidebar-logout" id="logout-btn">Logout</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <header class="page-header">
      <h1>Expense Management</h1>
      <button class="btn btn-primary" id="add-expense-btn">+ Add Expense</button>
    </header>

    <!-- Messages -->
    <div id="expense-error" class="error-banner hidden"></div>
    <div id="expense-success" class="success-banner hidden"></div>

    <!-- Add / Edit Expense Form (Hidden by default) -->
    <section class="expense-form-section hidden" id="expense-form-section">
      <div class="card">
        <h2 id="form-title">Add New Expense</h2>
        <form id="expense-form" class="expense-form">
          <input type="hidden" id="expense-id">
          <div class="form-row">
            <div class="form-group">
              <label for="expense-description">Description *</label>
              <input type="text" id="expense-description" placeholder="e.g. Lunch at canteen" required>
            </div>
            <div class="form-group">
              <label for="expense-amount">Amount (₱) *</label>
              <input type="number" id="expense-amount" placeholder="0.00" step="0.01" min="0.01" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="expense-category">Category</label>
              <select id="expense-category">
                <option value="Food">Food</option>
                <option value="Transportation">Transportation</option>
                <option value="Education">Education</option>
                <option value="Bills">Bills</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Savings">Savings</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="expense-date">Date</label>
              <input type="date" id="expense-date">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="expense-payment">Payment Method</label>
              <select id="expense-payment">
                <option value="Cash">Cash</option>
                <option value="GCash">GCash</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Credit Card">Credit Card</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="expense-note">Note (optional)</label>
              <input type="text" id="expense-note" placeholder="Optional note">
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="form-submit-btn">Add Expense</button>
            <button type="button" class="btn btn-secondary" id="form-cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Summary Cards -->
    <section class="summary-section">
      <div class="summary-grid">
        <div class="summary-card"><span class="summary-label">Today</span><span class="summary-value" id="sum-today">₱0.00</span></div>
        <div class="summary-card"><span class="summary-label">This Week</span><span class="summary-value" id="sum-weekly">₱0.00</span></div>
        <div class="summary-card"><span class="summary-label">This Month</span><span class="summary-value" id="sum-monthly">₱0.00</span></div>
      </div>
    </section>

    <!-- Filters -->
    <section class="filters-section">
      <div class="filters-row">
        <input type="text" id="filter-search" placeholder="🔍 Search expenses..." class="filter-input">
        <select id="filter-category" class="filter-select">
          <option value="All">All Categories</option>
          <option value="Food">Food</option>
          <option value="Transportation">Transportation</option>
          <option value="Education">Education</option>
          <option value="Bills">Bills</option>
          <option value="Shopping">Shopping</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Health">Health</option>
          <option value="Savings">Savings</option>
          <option value="Other">Other</option>
        </select>
        <input type="date" id="filter-start" class="filter-input">
        <input type="date" id="filter-end" class="filter-input">
      </div>
    </section>

    <!-- Expense Table -->
    <section class="table-section">
      <div class="card">
        <table class="data-table" id="expense-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Payment</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expense-tbody">
            <tr><td colspan="6" class="text-secondary" style="text-align:center; padding:2rem;">No expenses yet. Click "+ Add Expense" to start tracking!</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/expenses.js"></script>
</body>
</html>
